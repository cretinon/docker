version: 2.1

commands:
  circleci-image-update:
    description: 'update apt repo'
    steps:
      - run:
          name: circleci image update
          command: sudo mkdir -p /var/lib/apt/lists/partial ; sudo chmod 755 /var/lib/apt/lists/ ; sudo rm -rf /etc/apt/sources.list.d/github_git-lfs.list; sudo apt update

  install-bats:
    description: 'install bats from apt'
    steps:
      - run:
          name: Install bats
          command: sudo apt install -y bats

  install-shellcheck:
    description: 'install shellcheck from apt'
    steps:
      - run:
          name: Install shellcheck
          command: sudo apt install -y shellcheck

  install-make:
    description: 'install make from apt'
    steps:
      - run:
          name: Install make
          command: sudo apt install -y make

  checkout-prereq:
    description: 'mkdir'
    steps:
      - run:
          name : mkdir destination directory for git checkout
          command: mkdir -p git/docker

  checkout-libshell:
    description: 'checkout libshell'
    steps:
      - run:
          name : checkout libshell
          command: mkdir -p git/shell ; git clone https://github.com/cretinon/shell.git git/shell/

  prepare-our-environment:
    description: 'set all prereq for my_warp'
    steps:
      - run:
          name: set all prereq for my_warp
          command: chmod +x ${HOME}/project/git/shell/my_warp.sh ; mkdir ${HOME}/conf ; echo -e "VERBOSE=false\nDEBUG=false\nFUNC_LIST=()\nGIT_DIR=\"\${HOME}/project/git\"" > ${HOME}/conf/my_warp.conf

  circleci-image-result:
    description: 'results of previous build steps'
    steps:
      - run:
          name : Results of previous build steps
          command: type bats ; bats --version ; type shellcheck ; shellcheck --version ; type make ; make -v ; echo -n "pwd:"; pwd ; find . ; echo "my_warp.conf" ; cat ${HOME}/conf/my_warp.conf

  run-shellcheck:
    description: 'run shellcheck'
    steps:
      - run:
          name: Run shellcheck
          command: echo "shellcheck git/docker/lib_docker.sh"

  run-bats:
    description: 'run bats'
    steps:
      - run:
          name: Run bats
          command: GIT_DIR="${HOME}/project/git" echo "bats --verbose-run git/docker/bats/tests.bats"

  build-image-using-my_warp:
    description: 'test build using my_warp'
    steps:
      - run:
          name: test build using my_warp
          command: cd "${HOME}/project/git/docker" ; ${HOME}/project/git/shell/my_warp.sh --lib docker make_build --docker_file dockerfile/Dockerfile.jinade_base.x86_64.debian

jobs:
  build-and-test:
    docker:
      - image: cimg/base:current
    steps:
      - circleci-image-update
      - install-bats
      - install-shellcheck
      - install-make
      - checkout-prereq
      - checkout:
          path: git/docker
      - checkout-libshell
      - prepare-our-environment
      - circleci-image-result
      - run-shellcheck
      - run-bats
      - setup_remote_docker:
          docker_layer_caching: true
      - build-image-using-my_warp

workflows:
  test-libdocker:
     jobs:
       - build-and-test
